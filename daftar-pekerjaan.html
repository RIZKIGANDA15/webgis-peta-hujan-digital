<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daftar Pekerjaan Drainase</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      height: 66px;
      padding: 12px 20px;
      background: #0f766e;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    #appContainer {
      display: flex;
      width: 100%;
      height: calc(100vh - 66px);
      overflow: hidden;
    }

    #panelKiri {
      width: 300px;
      min-width: 300px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    #panelKanan {
      width: 410px;
      min-width: 410px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .panel-header {
      height: 46px;
      padding: 13px;
      background: #374151;
      color: white;
      font-weight: bold;
    }

    #panelKanan .panel-header {
      background: #0f766e;
    }

    .panel-content {
      height: calc(100% - 46px);
      padding: 14px;
      overflow-y: auto;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    .info-box {
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading-box {
      padding: 12px;
      background: #ecfdf5;
      border: 1px solid #99f6e4;
      border-radius: 8px;
      color: #0f766e;
      font-size: 13px;
    }

    .error-box {
      padding: 12px;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
    }

    .tahun-group {
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      overflow: hidden;
    }

    .tahun-header {
      padding: 9px 10px;
      background: #e5e7eb;
      color: #111827;
      font-size: 13px;
      font-weight: bold;
    }

    .pekerjaan-item {
      padding: 10px;
      border-top: 1px solid #e5e7eb;
      cursor: pointer;
      background: white;
    }

    .pekerjaan-item:hover {
      background: #f0fdfa;
    }

    .pekerjaan-item.active {
      background: #ccfbf1;
      border-left: 4px solid #0f766e;
      padding-left: 6px;
    }

    .pekerjaan-nama {
      font-weight: bold;
      color: #0f766e;
      font-size: 13px;
      line-height: 1.4;
    }

    .pekerjaan-lokasi {
      margin-top: 4px;
      color: #6b7280;
      font-size: 11.5px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 10.5px;
      font-weight: bold;
    }

    .detail-title {
      margin: 0 0 12px;
      color: #0f766e;
      font-size: 18px;
      line-height: 1.4;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .detail-table td {
      padding: 8px 7px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
      line-height: 1.45;
    }

    .detail-table td:first-child {
      width: 125px;
      color: #4b5563;
      font-weight: bold;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      background: #0f766e;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0b5f59;
    }

    .btn-secondary {
      background: #374151;
    }

    .btn-secondary:hover {
      background: #1f2937;
    }

    @media (max-width: 1050px) {
      #panelKiri {
        width: 250px;
        min-width: 250px;
      }

      #panelKanan {
        width: 340px;
        min-width: 340px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Daftar Pekerjaan Drainase</h1>
    <p>Inventarisasi lokasi, layer, dan hasil perhitungan pekerjaan drainase</p>
  </header>

  <div id="appContainer">

    <aside id="panelKiri">
      <div class="panel-header">
        Layer Pekerjaan
      </div>

      <div class="panel-content">

        <div id="daftarPekerjaan">
          <div class="loading-box">
            Membaca data pekerjaan dari Google Sheets...
          </div>
        </div>

        <button class="btn" id="btnMuatUlang" type="button">
          Muat Ulang Data
        </button>

        <a href="index.html" class="btn btn-secondary">
          Kembali ke Home
        </a>

      </div>
    </aside>

    <div id="map"></div>

    <aside id="panelKanan">
      <div class="panel-header">
        Rekap Pekerjaan
      </div>

      <div class="panel-content" id="detailPekerjaan">
        <div class="info-box">
          Pilih salah satu pekerjaan pada panel kiri untuk melihat data
          pekerjaan tersebut.
        </div>
      </div>
    </aside>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxl_ZXQrUbhp5k339Khc18o_N49cCiW31K6YA0HqGBegxlSNkE0J0XFxQi5DBbWNJvf/exec";

    const map = L.map("map", {
      zoomControl: true
    }).setView([-6.225, 106.900], 11);

    const googleHybrid = L.tileLayer(
      "https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
      {
        maxZoom: 20,
        subdomains: ["mt0", "mt1", "mt2", "mt3"],
        attribution: "&copy; Google Hybrid"
      }
    ).addTo(map);

    let dataPekerjaan = [];
    let pekerjaanAktifId = null;

    function escapeHtml(teks) {
      return String(teks || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function tampilkanKosong() {
      document.getElementById("daftarPekerjaan").innerHTML = `
        <div class="info-box">
          Belum ada data pekerjaan pada Google Sheets.
        </div>
      `;
    }

    function tampilkanError(pesan) {
      document.getElementById("daftarPekerjaan").innerHTML = `
        <div class="error-box">
          <b>Data gagal dibaca.</b><br>
          ${escapeHtml(pesan)}
        </div>
      `;
    }

    function kelompokkanPekerjaanPerTahun(data) {
      const kelompok = {};

      data.forEach(function (pekerjaan) {
        const tahun = pekerjaan.tahun || "Tanpa Tahun";

        if (!kelompok[tahun]) {
          kelompok[tahun] = [];
        }

        kelompok[tahun].push(pekerjaan);
      });

      return kelompok;
    }

    function renderDaftarPekerjaan() {
      const wadah = document.getElementById("daftarPekerjaan");

      if (!dataPekerjaan.length) {
        tampilkanKosong();
        return;
      }

      const kelompok = kelompokkanPekerjaanPerTahun(dataPekerjaan);

      const daftarTahun = Object.keys(kelompok).sort(function (a, b) {
        return String(b).localeCompare(String(a));
      });

      let html = "";

      daftarTahun.forEach(function (tahun) {
        html += `
          <div class="tahun-group">
            <div class="tahun-header">
              ▼ Tahun ${escapeHtml(tahun)}
            </div>
        `;

        kelompok[tahun].forEach(function (pekerjaan) {
          const aktif =
            pekerjaan.id_pekerjaan === pekerjaanAktifId
              ? "active"
              : "";

          html += `
            <div
              class="pekerjaan-item ${aktif}"
              data-id="${escapeHtml(pekerjaan.id_pekerjaan)}"
            >
              <div class="pekerjaan-nama">
                ${escapeHtml(pekerjaan.nama_pekerjaan || "Tanpa Nama")}
              </div>

              <div class="pekerjaan-lokasi">
                ${escapeHtml(pekerjaan.lokasi || "Lokasi belum diisi")}
              </div>

              <span class="badge">
                ${escapeHtml(pekerjaan.status || "Belum Ada Status")}
              </span>
            </div>
          `;
        });

        html += `</div>`;
      });

      wadah.innerHTML = html;

      document
        .querySelectorAll(".pekerjaan-item")
        .forEach(function (elemen) {
          elemen.addEventListener("click", function () {
            pilihPekerjaan(this.dataset.id);
          });
        });
    }

    function pilihPekerjaan(idPekerjaan) {
      const pekerjaan = dataPekerjaan.find(function (item) {
        return item.id_pekerjaan === idPekerjaan;
      });

      if (!pekerjaan) {
        return;
      }

      pekerjaanAktifId = idPekerjaan;
      renderDaftarPekerjaan();
      tampilkanDetailPekerjaan(pekerjaan);
    }

    function tampilkanDetailPekerjaan(pekerjaan) {
      const detail = document.getElementById("detailPekerjaan");

      detail.innerHTML = `
        <h2 class="detail-title">
          ${escapeHtml(pekerjaan.nama_pekerjaan || "Tanpa Nama")}
        </h2>

        <table class="detail-table">
          <tbody>
            <tr>
              <td>ID Pekerjaan</td>
              <td>${escapeHtml(pekerjaan.id_pekerjaan || "-")}</td>
            </tr>

            <tr>
              <td>Tahun</td>
              <td>${escapeHtml(pekerjaan.tahun || "-")}</td>
            </tr>

            <tr>
              <td>Lokasi</td>
              <td>${escapeHtml(pekerjaan.lokasi || "-")}</td>
            </tr>

            <tr>
              <td>Kecamatan</td>
              <td>${escapeHtml(pekerjaan.kecamatan || "-")}</td>
            </tr>

            <tr>
              <td>Kelurahan</td>
              <td>${escapeHtml(pekerjaan.kelurahan || "-")}</td>
            </tr>

            <tr>
              <td>Status</td>
              <td>${escapeHtml(pekerjaan.status || "-")}</td>
            </tr>

            <tr>
              <td>Catatan</td>
              <td>${escapeHtml(pekerjaan.catatan || "-")}</td>
            </tr>

            <tr>
              <td>Dibuat</td>
              <td>${escapeHtml(pekerjaan.dibuat_pada || "-")}</td>
            </tr>

            <tr>
              <td>Diperbarui</td>
              <td>${escapeHtml(pekerjaan.diperbarui_pada || "-")}</td>
            </tr>
          </tbody>
        </table>

        <div class="info-box" style="margin-top:14px;">
          Tabel rekap segmen saluran akan ditampilkan pada tahap berikutnya.
        </div>
      `;
    }

    async function muatDataPekerjaan() {
      const wadah = document.getElementById("daftarPekerjaan");

      wadah.innerHTML = `
        <div class="loading-box">
          Membaca data pekerjaan dari Google Sheets...
        </div>
      `;

      try {
        const response = await fetch(
          API_URL + "?sheet=Pekerjaan&t=" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "Respons server tidak berhasil: " + response.status
          );
        }

        const hasil = await response.json();

        if (!hasil.success) {
          throw new Error(
            hasil.message || "API mengembalikan status gagal."
          );
        }

        dataPekerjaan = Array.isArray(hasil.data)
          ? hasil.data
          : [];

        renderDaftarPekerjaan();

      } catch (error) {
        console.error(error);
        tampilkanError(error.message);
      }
    }

    document
      .getElementById("btnMuatUlang")
      .addEventListener("click", muatDataPekerjaan);

    muatDataPekerjaan();
  </script>

</body>
</html>
