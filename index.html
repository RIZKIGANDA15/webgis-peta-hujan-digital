<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebGIS Data Hujan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 14px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 76px);
    }
  </style>
</head>
<body>
  <header>
    <h1>WebGIS Data Hujan</h1>
    <p>Peta digital untuk visualisasi data hujan</p>
  </header>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    // Membuat peta dengan titik tengah wilayah Jakarta Timur
    var map = L.map('map').setView([-6.225, 106.900], 11);

    // Menambahkan peta dasar OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Contoh titik data hujan
    var titikHujan = L.marker([-6.225, 106.900]).addTo(map);

    titikHujan.bindPopup(`
      <b>Contoh Pos Hujan</b><br>
      Wilayah: Jakarta Timur<br>
      Curah Hujan: 45 mm<br>
      Kategori: Hujan Sedang
    `);
  </script>
</body>
</html>
