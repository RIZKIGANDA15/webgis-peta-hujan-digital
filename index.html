<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebGIS Data Hujan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 14px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 76px);
    }
  </style>
</head>
<body>
  <header>
    <h1>WebGIS Data Hujan</h1>
    <p>Peta digital untuk visualisasi data hujan</p>
  </header>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    // Membuat peta dengan titik tengah wilayah Jakarta Timur
    var map = L.map('map').setView([-6.225, 106.900], 11);

    // Menambahkan peta dasar OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

   // Membaca data stasiun hujan dari file CSV
var layerStasiunHujan = L.layerGroup().addTo(map);

var overlayMaps = {
  "Stasiun Hujan": layerStasiunHujan
};

L.control.layers(null, overlayMaps, {
  collapsed: false
}).addTo(map);

fetch("data_stasiun_hujan.csv")
  .then(response => response.text())
  .then(csvText => {
    const rows = csvText.trim().split("\n");

    // Dikarenakan CSV memakai pemisah titik koma ;
    const headers = rows[0].split(";").map(header => header.trim());

    rows.slice(1).forEach(row => {
      const values = row.split(";");
      const data = {};

      headers.forEach((header, index) => {
        data[header] = values[index] ? values[index].trim() : "";
      });

      const latitude = parseFloat(data.latitude);
      const longitude = parseFloat(data.longitude);

      if (!isNaN(latitude) && !isNaN(longitude)) {
        const marker = L.marker([latitude, longitude]);

        marker.bindPopup(`
          <b>${data.nama_stasiun}</b><br>
          Wilayah: ${data.wilayah}
        `);

        marker.addTo(layerStasiunHujan);
      }
    });
  });
  </script>
</body>
</html>
