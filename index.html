<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebGIS Data Hujan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 14px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
    }

    #appContainer {
      display: flex;
      width: 100%;
      height: calc(100vh - 76px);
    }

    #layerPanel {
      width: 20%;
      min-width: 240px;
      max-width: 320px;
      height: 100%;
      background: white;
      z-index: 1000;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.25);
      font-size: 14px;
      overflow: hidden;
      transition: width 0.3s ease, min-width 0.3s ease;
    }

    #layerHeader {
      background: #333;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    #togglePanel {
      background: transparent;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    #layerContent {
      padding: 14px;
    }

    #layerContent label {
      display: block;
      margin-bottom: 12px;
      cursor: pointer;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    #layerPanel.minimized {
      width: 42px;
      min-width: 42px;
    }

    #layerPanel.minimized #layerHeader {
      height: 100%;
      padding: 8px 4px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      justify-content: center;
      gap: 10px;
    }

    #layerPanel.minimized #layerHeader span {
      transform: rotate(180deg);
    }

    #layerPanel.minimized #togglePanel {
      transform: rotate(90deg);
    }

    #layerPanel.minimized #layerContent {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>WebGIS Data Hujan</h1>
    <p>Peta digital untuk visualisasi data hujan</p>
  </header>

  <div id="appContainer">
    <div id="layerPanel">
      <div id="layerHeader">
        <span>Layer Peta</span>
        <button id="togglePanel">−</button>
      </div>

      <div id="layerContent">
        <label>
          <input type="checkbox" id="cekStasiunHujan" checked>
          Stasiun Hujan
        </label>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    // Membuat peta dengan titik tengah wilayah Jakarta Timur
    var map = L.map('map').setView([-6.225, 106.900], 11);

    // Menambahkan peta dasar OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Membuat layer khusus untuk stasiun hujan
    var layerStasiunHujan = L.layerGroup().addTo(map);

    // Membaca data stasiun hujan dari file CSV
    fetch("data_stasiun_hujan.csv")
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.trim().split("\n");

        // Dikarenakan CSV memakai pemisah titik koma ;
        const headers = rows[0].split(";").map(header => header.trim());

        rows.slice(1).forEach(row => {
          const values = row.split(";");
          const data = {};

          headers.forEach((header, index) => {
            if (header !== "") {
              data[header] = values[index] ? values[index].trim() : "";
            }
          });

          const latitude = parseFloat(data.latitude);
          const longitude = parseFloat(data.longitude);

          if (!isNaN(latitude) && !isNaN(longitude)) {
            const marker = L.marker([latitude, longitude]);

            marker.bindPopup(`
              <b>${data.nama_stasiun}</b><br>
              Wilayah: ${data.wilayah}
            `);

            marker.addTo(layerStasiunHujan);
          }
        });
      });

    // Mengatur checkbox untuk menampilkan atau menyembunyikan layer stasiun hujan
    document.getElementById("cekStasiunHujan").addEventListener("change", function () {
      if (this.checked) {
        map.addLayer(layerStasiunHujan);
      } else {
        map.removeLayer(layerStasiunHujan);
      }
    });

    // Mengatur tombol minimize dan maximize panel layer
    document.getElementById("togglePanel").addEventListener("click", function () {
      var panel = document.getElementById("layerPanel");
      panel.classList.toggle("minimized");

      if (panel.classList.contains("minimized")) {
        this.textContent = "›";
      } else {
        this.textContent = "−";
      }

      setTimeout(function () {
        map.invalidateSize();
      }, 300);
    });
  </script>
</body>
</html>
